services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        image: my-posyandu-app:local
        working_dir: /var/www/html
        env_file:
            - .env
        environment:
            APP_ENV: local
            APP_DEBUG: 'true'
            APP_URL: http://localhost:8000
            DB_CONNECTION: pgsql
            DB_HOST: db
            DB_PORT: '5432'
            DB_DATABASE: posyandu_jeruk
            DB_USERNAME: posyandu_user
            DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env before starting Docker}
            CACHE_STORE: database
            SESSION_DRIVER: database
            QUEUE_CONNECTION: database
        volumes:
            - .:/var/www/html
            - app_vendor:/var/www/html/vendor
            - app_storage:/var/www/html/storage
            - app_bootstrap_cache:/var/www/html/bootstrap/cache
        depends_on:
            db:
                condition: service_healthy

    db:
        image: postgres:16-alpine
        restart: unless-stopped
        environment:
            POSTGRES_DB: posyandu_jeruk
            POSTGRES_USER: posyandu_user
            POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env before starting Docker}
        volumes:
            - postgres_data:/var/lib/postgresql/data
        ports:
            - '127.0.0.1:5443:5432'
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U posyandu_user -d posyandu_jeruk']
            interval: 5s
            timeout: 5s
            retries: 10

    nginx:
        image: nginx:alpine
        restart: unless-stopped
        ports:
            - '8000:80'
        volumes:
            - .:/var/www/html:ro
            - app_storage:/var/www/html/storage:ro
            - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            - app

    frontend:
        image: node:22-alpine
        working_dir: /var/www/html
        command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
        environment:
            VITE_USE_POLLING: 'true'
        volumes:
            - .:/var/www/html
            - node_modules:/var/www/html/node_modules
        ports:
            - '5173:5173'

volumes:
    postgres_data:
    app_vendor:
    app_storage:
    app_bootstrap_cache:
    node_modules:
